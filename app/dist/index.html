<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Negociações</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <link 
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
/>
    <link rel="shortcut icon" href="favicon.ico" type="image/ico"/>
</head>
<body class="container">
    <h1 class="text-center">Negociações</h1>    
    <div id="mensagemView"></div>    
    <form class="form">        
        <div class="form-group">
            <label for="data">Data</label>
            <input type="date" id="data" class="form-control" required value="" autofocus/>        
        </div>
        <div class="form-group">
            <label for="quantidade">Quantidade</label>
            <input type="number" min="1" step="1" id="quantidade" class="form-control" value="1" required/>
        </div>
        <div class="form-group">
            <label for="valor">Valor</label>
            <input id="valor" type="text" class="form-control valor-moeda"  min="0.01" step="0.01" value="0,00" required />
        </div>
        <button class="btn btn-primary" type="submit">
            <i class="fas fa-plus-square"></i> Adicionar
        </button>
        <button id="botao-importa" class="btn btn-success">
            <i class="fas fa-file-import"></i> Importar
        </button>
        <button id="botao-limpar" class="btn btn-danger">
            <i class="fas fa-trash"></i> Limpar
        </button>
    </form>
    <br>
    <br>
    <div id="negociacoesView"></div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
